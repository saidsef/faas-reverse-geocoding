version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    install:
      # Read the Docs wraps each job in /bin/sh -c '...', so single quotes here break out of it.
      - pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5" "pygments>=2.18" "pymdown-extensions>=10.7"

mkdocs:
  configuration: mkdocs.yml
